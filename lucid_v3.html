    </div>
  );
}


/* ═══════════════════════════════════════════════════════════
   LEARN SCREEN
═══════════════════════════════════════════════════════════ */
function LearnScreen({ t }) {
  return (
    <div className="content-area" style={{ padding:"28px 28px 60px", maxWidth:760 }}>
      <div className="fade-up" style={{ marginBottom:24 }}>
        <p style={{ fontSize:11, letterSpacing:"0.12em", textTransform:"uppercase", color:t.muted, fontWeight:500, marginBottom:6 }}>Foundations</p>
        <h1 className="page-title" style={{ fontFamily:"'Instrument Serif',serif", fontSize:26, color:t.ink, lineHeight:1.2, fontWeight:400 }}>How it all works</h1>
        <p style={{ fontSize:14, color:t.muted, marginTop:6 }}>Plain language. No jargon.</p>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:12 }}>
        {concepts.map((c, i) => (
          <div key={i} className={`fade-up-${Math.min(i+1,6)}`} style={{
            background:t.card, borderRadius:16, padding:"18px 20px",
            border:`1px solid ${t.border}`,
            boxShadow:`0 1px 4px rgba(0,0,0,${t===lightTheme?0.05:0.2})`,
          }}>
            <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:10 }}>
              <span style={{ fontSize:20 }}>{c.icon}</span>
              <span style={{ fontSize:15, fontWeight:600, color:t.ink }}>{c.title}</span>
            </div>
            <p style={{ fontSize:13, color:t.muted, lineHeight:1.65 }}>{c.body}</p>
          </div>
        ))}
      </div>
    </div>
  );
}


/* ═══════════════════════════════════════════════════════════
   BOTTOM NAV (mobile)
═══════════════════════════════════════════════════════════ */
function BottomNav({ tab, setTab, t }) {
  const items = [
    { id:"overview",  icon:"⬡", label:"Overview" },
    { id:"movements", icon:"↗", label:"Pairs" },
    { id:"learn",     icon:"◎", label:"Learn" },
  ];
  return (
    <div className="show-mobile" style={{
      position:"fixed", bottom:0, left:0, right:0, zIndex:200,
      background:`${t.card}F0`, backdropFilter:"blur(16px)",
      borderTop:`1px solid ${t.border}`, padding:"10px 0 22px",
      display:"flex", justifyContent:"space-around",
    }}>
      {items.map(item => {
        const active = tab === item.id;
        return (
          <button key={item.id} onClick={() => setTab(item.id)} style={{
            background:"none", border:"none", cursor:"pointer",
            display:"flex", flexDirection:"column", alignItems:"center", gap:3, padding:"4px 22px",
            fontFamily:"'DM Sans',sans-serif",
          }}>
            <span style={{ fontSize:18, color: active ? t.accent : t.ink, opacity: active ? 1 : 0.38 }}>{item.icon}</span>
            <span style={{ fontSize:10, fontWeight: active ? 600 : 400, color: active ? t.accent : t.muted }}>{item.label}</span>
          </button>
        );
      })}
    </div>
  );
}


/* ═══════════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════════ */
function App() {
  const [page,   setPage]   = React.useState("landing");
  const [tab,    setTab]    = React.useState("overview");
  const [dark,   setDark]   = React.useState(false);
  const [detail, setDetail] = React.useState(null); // { type: 'currency'|'pair', data }
  const [searchQuery, setSearchQuery] = React.useState("");

  const t = dark ? darkTheme : lightTheme;

  const handleTabChange = (newTab) => {
    setTab(newTab);
    setDetail(null);
    setSearchQuery("");
  };

  const handleCurrencyTap = (currency) => setDetail({ type: "currency", data: currency });
  const handlePairTap     = (pair)     => setDetail({ type: "pair",     data: pair });
  const handleBack        = ()         => setDetail(null);

  if (page === "landing") {
    return <Landing onEnter={() => setPage("app")} />;
  }

  return (
    <div data-dark={dark} style={{ background:t.bg, minHeight:"100vh", display:"flex", flexDirection:"column" }}
         onClick={() => {/* close any open dropdowns on bg click */}}>
      <div className="app-layout" style={{ display:"grid", gridTemplateColumns:"220px 1fr", minHeight:"100vh" }}>
        <Sidebar tab={tab} setTab={handleTabChange} dark={dark} toggleDark={() => setDark(d => !d)} t={t}/>

        <div style={{ display:"flex", flexDirection:"column", minHeight:"100vh", overflow:"hidden" }}>
          <Header t={t} dark={dark} toggleDark={() => setDark(d => !d)} notifs={notifications}/>
          <main style={{ flex:1, overflowY:"auto" }}>
            {detail?.type === "currency" ? (
              <CurrencyDetailScreen currency={detail.data} onBack={handleBack} t={t}/>
            ) : detail?.type === "pair" ? (
              <PairDetailScreen pair={detail.data} onBack={handleBack} t={t}/>
            ) : tab === "overview" ? (
              <OverviewScreen onCurrencyTap={handleCurrencyTap} t={t}/>
            ) : tab === "movements" ? (
              <MovementsScreen onPairTap={handlePairTap} t={t} searchQuery={searchQuery} setSearchQuery={setSearchQuery}/>
            ) : (
              <LearnScreen t={t}/>
            )}
          </main>
        </div>
      </div>

      <BottomNav tab={tab} setTab={handleTabChange} t={t}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
