    const nextUrl = new URL(url, window.location.href);
    nextUrl.searchParams.set("_lucid_ts", String(Date.now()));
    return nextUrl.toString();
  } catch {
    const separator = url.includes("?") ? "&" : "?";
    return `${url}${separator}_lucid_ts=${Date.now()}`;

function normalizePayload(payload) {
  const rawSummaries = payload?.lucid_summaries || payload?.summaries || samplePayload.lucid_summaries;
  const summaryMap = Array.isArray(rawSummaries)
    ? Object.fromEntries(rawSummaries.map((item) => [item.currency, item]))
    : rawSummaries;
  const summaries = CURRENCY_ORDER
    .map((code) => summaryMap?.[code])
    .filter(Boolean);
  return {
    generated_at: payload?.generated_at || samplePayload.generated_at,
    source: payload?.source || samplePayload.source,
    summary_mode: payload?.summary_mode || samplePayload.summary_mode,
    disclaimer: payload?.disclaimer || samplePayload.disclaimer,
    market_story: payload?.market_story || samplePayload.market_story,
    macro_shock: payload?.macro_shock || null,
    narrative_focus: payload?.narrative_focus || null,
    macro_evolution: payload?.macro_evolution || null,
    price_alignment: payload?.price_alignment || null,
    summaries,
    events: payload?.lucid_events || samplePayload.lucid_events,
    pairs: payload?.lucid_pairs || samplePayload.lucid_pairs,
  };
}

function formatNarrativeTheme(theme) {
  const labels = {
    us_policy: "US policy",
    us_inflation: "US inflation",
    europe_growth: "European growth",
    uk_inflation: "UK inflation",
    china_global_demand: "China & global demand",
    oil_cad: "Oil & CAD",
    risk_mood: "Market mood",
    safe_haven: "Defensive currencies",
    macro_pressure: "Macro pressure",
    central_bank_guidance: "Central bank guidance",
    commodities: "Commodities",
    global_macro_backdrop: "Global macro backdrop",
  };
  if (labels[theme]) return labels[theme];
  return String(theme || "")
    .replace(/_/g, " ")
    .replace(/\b\w/g, (letter) => letter.toUpperCase());
}

function narrativeFocusMatchesStory(focus, story) {
  if (!focus?.theme) return false;
  const text = `${story?.title || ""} ${story?.body || ""}`.toLowerCase();
  const tokens = {
    us_policy: ["usd", "dollar", "fed", "us ", "rate", "policy"],
    us_inflation: ["usd", "dollar", "fed", "us ", "inflation", "cpi"],
    europe_growth: ["eur", "euro", "europe", "growth"],
    uk_inflation: ["gbp", "pound", "uk", "boe", "inflation"],
    china_global_demand: ["aud", "nzd", "china", "global demand", "commodity", "cyclical"],
    oil_cad: ["cad", "canadian", "oil"],
    risk_mood: ["risk", "mood", "defensive", "safe", "jpy", "chf", "yen", "franc"],
    safe_haven: ["safe", "defensive", "jpy", "chf", "yen", "franc"],
    macro_pressure: ["pressure", "oil", "risk", "geopolitical"],
    central_bank_guidance: ["guidance", "central bank", "fed", "ecb", "boe", "boj", "policy"],
    commodities: ["commodity", "oil", "cad", "aud", "nzd"],
    global_macro_backdrop: ["global", "macro", "market"],
  };
  return (tokens[focus.theme] || []).some((token) => text.includes(token));
}

function formatGeneratedAt(value) {
  if (!value || value === "Today") return formatDisplayDate(value);
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleDateString("en-US", { month: "long", day: "numeric" });
}

function formatDisplayDate(value) {
  const date = value && value !== "Today" ? new Date(value) : new Date();
  if (Number.isNaN(date.getTime())) return "Today";
  return date.toLocaleDateString("en-US", { month: "long", day: "numeric" });
}

function dataSourceLabel(data) {
  if (data.summary_mode === "Narrative-derived") return "Macro context";
  if (data.summary_mode === "Calendar-derived") return "Economic calendar";
  return "Sample data";
}

function dataModeNote(data) {
  if (data.summary_mode === "Narrative-derived") return "Full macro view";
  if (data.summary_mode === "Calendar-derived") return "Calendar view";
  return "Preview mode";
}

function useLucidData() {
  const [state, setState] = React.useState({
    data: normalizePayload(samplePayload),
    loading: Boolean(LUCID_API_URL),
    error: null,
  });

  React.useEffect(() => {
    if (!LUCID_API_URL) return;
    let active = true;
    fetch(uncachedUrl(LUCID_API_URL), { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((payload) => {
        if (active) setState({ data: normalizePayload(payload), loading: false, error: null });
      })
      .catch((error) => {
        if (active) setState({ data: normalizePayload(samplePayload), loading: false, error: error.message });
      });
    return () => { active = false; };
  }, []);

  return state;
}

function useLucidAuth() {
  const configured = Boolean(window.LucidSupabase?.isConfigured());
  const [state, setState] = React.useState({
    loading: configured,
    configured,
    session: null,
    profile: null,
    error: null,
  });

  React.useEffect(() => {
    let active = true;
    if (!configured) {
      setState((current) => ({ ...current, loading: false }));
      return () => { active = false; };
    }

    async function loadAuth() {
      try {
        const { data, error } = await window.LucidSupabase.getSession();
        if (error) throw error;

        const session = data.session;
        if (!session?.user) {
          window.location.href = "auth.html?mode=login";
          return;
        }

        const profileResult = await window.LucidSupabase.getProfile(session.user);
        if (profileResult.error) {
          console.error("[Lucid auth] profile query failed", profileResult.error);
          console.error("[Lucid auth] profile diagnostics", profileResult.diagnostics);
          const message = "We could not verify your access. Please sign in again. If this continues, contact support.";
          throw new Error(message);
        }
        const profile = profileResult.profile;

        if (profile && !window.LucidSupabase.hasAccess(profile)) {
          await window.LucidSupabase.markExpired(profile);
        }

        if (active) {
          setState({ loading: false, configured: true, session, profile, error: null });
        }
      } catch (error) {
        if (active) {
          setState({ loading: false, configured: true, session: null, profile: null, error: error.message });
        }
      }
    }

    loadAuth();
    return () => { active = false; };
  }, [configured]);

  return state;
}

  return { color: t.muted, bg: t.inputBg, text: "Neutral" };
}

function calendarAttentionLabel(summary) {
  return summary?.key_event ? "In focus" : "Quiet";
}

function currencyDisplayLabel(summary, summaryMode) {
  if (summaryMode === "Calendar-derived") return calendarAttentionLabel(summary);
  return summary?.label || "Neutral";
}

function currencyBadgeStyle(summary, summaryMode, t) {
  const label = currencyDisplayLabel(summary, summaryMode);
  if (label === "In focus") {
    return {
      color: t.accent,
      bg: t.isDark ? "rgba(123,108,246,0.105)" : "rgba(83,71,232,0.12)",
      text: "In focus",
    };
  }
  if (label === "Quiet") {
    return {
      color: t.muted,
      bg: t.inputBg,
      text: "Quiet",
    };
  }
  return labelStyle(label, t);
}

function labelSurface(label, t) {
  const supportedTint = t.isDark ? "rgba(123,108,246,0.052)" : "rgba(83,71,232,0.105)";
  const supportedWash = t.isDark ? "rgba(123,108,246,0.034)" : "rgba(83,71,232,0.070)";
  const supportedBorder = t.isDark ? "rgba(123,108,246,0.135)" : "rgba(83,71,232,0.18)";
  const supportedGlow = t.isDark ? "0 18px 46px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.035)" : "0 20px 54px rgba(83,71,232,0.080), inset 0 1px 0 rgba(255,255,255,0.50)";
  const weakTint = t.isDark ? "rgba(201,131,111,0.045)" : "rgba(192,90,66,0.095)";
  const weakWash = t.isDark ? "rgba(201,131,111,0.030)" : "rgba(192,90,66,0.065)";
  const weakBorder = t.isDark ? "rgba(201,131,111,0.130)" : "rgba(192,90,66,0.18)";
  const weakGlow = t.isDark ? "0 18px 44px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.032)" : "0 20px 54px rgba(192,90,66,0.060), inset 0 1px 0 rgba(255,255,255,0.48)";
  const neutralTint = t.isDark ? "rgba(137,145,159,0.040)" : "rgba(140,144,154,0.075)";
  const neutralGlow = t.isDark ? "0 18px 44px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.030)" : "0 18px 48px rgba(10, 15, 35, 0.050), inset 0 1px 0 rgba(255,255,255,0.45)";
  if (label === "Supported") {
    return {
      bg: `radial-gradient(circle at 92% 8%, ${supportedTint}, transparent 34%), linear-gradient(145deg, ${t.card} 0%, ${supportedWash} 100%)`,
      border: supportedBorder,
      glow: supportedGlow,
      accent: t.accent,
    };
  }
  if (label === "Weak") {
    return {
      bg: `radial-gradient(circle at 92% 8%, ${weakTint}, transparent 34%), linear-gradient(145deg, ${t.card} 0%, ${weakWash} 100%)`,
      border: weakBorder,
      glow: weakGlow,
      accent: t.isDark ? "#C9836F" : "#C05A42",
    };
  }
  return {
    bg: `radial-gradient(circle at 92% 8%, ${neutralTint}, transparent 34%), linear-gradient(145deg, ${t.card} 0%, ${t.inputBg} 100%)`,
    border: t.border,
    glow: neutralGlow,
    accent: t.muted,
  };
}

function driverTone(t, surface) {
  return {
    bg: "rgba(140,144,154,0.070)",
    border: t.border,
    color: surface?.accent || t.muted,
    bullet: surface?.accent || t.muted,
  };
}

function pairSurface(item, t, muted) {
  const base = labelSurface(item.base_label, t);
  const quote = labelSurface(item.quote_label, t);
  const interactionType = item?.narrative?.interaction_type || item?.interaction_type || "";
  const relational = interactionType && interactionType !== "mixed_macro_forces";
  const relevant = relational && (item?.has_key_event || item?.base_key_event || item?.quote_key_event || item?.narrative_focus_match);
  const clear = !muted && !pairIsMixed(item);
  const lively = clear || relational;
  const tintFor = (label, side = "base") => {
    if (label === "Supported") return t.isDark ? "rgba(123,108,246,0.075)" : "rgba(83,71,232,0.115)";
    if (label === "Weak") return t.isDark ? "rgba(201,131,111,0.060)" : "rgba(192,90,66,0.100)";
    if (relational) {
      if (side === "base") return t.isDark ? "rgba(123,108,246,0.062)" : "rgba(83,71,232,0.090)";
      return t.isDark ? "rgba(177,169,255,0.050)" : "rgba(123,108,246,0.070)";
    }
    return t.isDark ? "rgba(137,145,159,0.040)" : "rgba(140,144,154,0.060)";
  };
  const pressureFor = (label, side = "base") => {
    if (label === "Supported") return t.isDark ? "rgba(123,108,246,0.155)" : "rgba(83,71,232,0.175)";
    if (label === "Weak") return t.isDark ? "rgba(201,131,111,0.115)" : "rgba(192,90,66,0.145)";
    if (relational) {
      if (side === "base") return t.isDark ? "rgba(123,108,246,0.145)" : "rgba(83,71,232,0.145)";
      return t.isDark ? "rgba(201,196,255,0.085)" : "rgba(123,108,246,0.105)";
    }
    return t.isDark ? "rgba(137,145,159,0.060)" : "rgba(140,144,154,0.085)";
  };
  return {
    bg: lively
      ? `radial-gradient(circle at 10% 12%, ${pressureFor(item.base_label, "base")}, transparent 36%), radial-gradient(circle at 90% 16%, ${pressureFor(item.quote_label, "quote")}, transparent 36%), linear-gradient(112deg, ${tintFor(item.base_label, "base")} 0%, ${t.card} 42%, ${t.card} 56%, ${tintFor(item.quote_label, "quote")} 100%)`
      : `radial-gradient(circle at 88% 12%, rgba(140,144,154,0.075), transparent 34%), linear-gradient(145deg, ${t.card} 0%, ${t.inputBg} 100%)`,
    border: lively
      ? (t.isDark ? (relevant ? "rgba(123,108,246,0.22)" : "rgba(123,108,246,0.17)") : (relevant ? "rgba(83,71,232,0.25)" : "rgba(83,71,232,0.20)"))
      : (t.isDark ? "rgba(137,145,159,0.12)" : "rgba(140,144,154,0.16)"),
    glow: lively
      ? (t.isDark ? `0 24px 62px rgba(0,0,0,0.30), 0 10px 30px rgba(83,71,232,${relevant ? 0.10 : 0.07}), inset 0 1px 0 rgba(255,255,255,0.042)` : `0 26px 72px rgba(83,71,232,${relevant ? 0.13 : 0.095}), 0 12px 34px rgba(10,15,35,0.055), inset 0 1px 0 rgba(255,255,255,0.56)`)
      : (t.isDark ? "0 14px 38px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.026)" : "0 14px 38px rgba(10, 15, 35, 0.040), inset 0 1px 0 rgba(255,255,255,0.40)"),
    leftAccent: base.accent,
    rightAccent: quote.accent,
    clear,
    relational,
    relevant,
  };
}

function displayTimeframe(value) {
  if (value === "Short-term") return "Near-term (next few weeks)";
  if (value === "Medium-term") return "Medium-term (next few months)";
  if (value === "Mixed") return "Mixed";
  return value || "Mixed";
}

function biasText(summary, summaryMode) {
  return `${summary.currency} - ${currencyDisplayLabel(summary, summaryMode)}`;
}

function mainDriver(summary) {
  return (summary.reasons || [])[0] || summary.insight || "The macro picture is still developing";
}

function supportingReasons(summary) {
  const reasons = (summary.reasons || []).slice(1, 3);
  if (reasons.length) return reasons;
  if (summary.insight && summary.insight !== mainDriver(summary)) return [summary.insight];
  return [];
}

function shortEventTitle(event) {
  const title = cleanDisplaySentence(event?.title || "");
  if (!title) return "new macro data";
  return title.replace(/\bDecision\b/g, "decision").replace(/\bRate\b/g, "rate");
}

function reframeNowTitle(title) {
  const text = cleanDisplaySentence(title);
  const lower = text.toLowerCase();
  if (lower.includes("fed") && lower.includes("rates")) return "Policy remains restrictive";
  if (lower.includes("weak growth")) return "Growth remains the pressure point";
  if (lower.includes("inflation")) return "Inflation is still shaping policy";
  if (lower.includes("risk mood")) return "Market mood is driving the story";
  if (lower.includes("global demand")) return "Global demand remains the driver";
  return text || "Macro direction is still forming";
}

function detectMacroThread(lead) {
  const currency = lead?.currency || "";
  const text = [
    lead?.headline,
    lead?.insight,
    ...(lead?.reasons || []),
  ].filter(Boolean).join(" ").toLowerCase();

  if (currency === "USD" || text.includes("fed") || text.includes("usd") || text.includes("jobs data") || text.includes("rate expectations")) {
    return { key: "us_policy", currency: "USD" };
  }
  if (currency === "EUR" || text.includes("europe") || text.includes("euro") || text.includes("growth")) {
    return { key: "europe_growth", currency: "EUR" };
  }
  if (currency === "GBP" || text.includes("inflation") || text.includes("boe")) {
    return { key: "inflation_policy", currency: currency || "GBP" };
  }
  if (currency === "JPY" || currency === "CHF" || text.includes("risk mood") || text.includes("safety") || text.includes("franc") || text.includes("yen")) {
    return { key: "market_mood", currency: currency || "JPY" };
  }
  if (currency === "CAD" || text.includes("oil")) {
    return { key: "oil_demand", currency: "CAD" };
  }
  if (currency === "AUD" || currency === "NZD" || text.includes("global demand") || text.includes("commodity") || text.includes("china")) {
    return { key: "global_demand", currency: currency || "AUD" };
  }
  return { key: "fallback", currency };
}

function eventMatchesThread(event, thread) {
  if (!event || !thread) return false;
  const currency = event.currency || "";
  const title = `${event.title || ""} ${event.market_focus || ""} ${event.why_it_matters || ""}`.toLowerCase();
  if (currency && currency === thread.currency) return true;
  if (thread.key === "us_policy") {
    return currency === "USD" || title.includes("fed") || title.includes("us ") || title.includes("employment") || title.includes("unemployment") || title.includes("inflation");
  }
  if (thread.key === "europe_growth") {
    return currency === "EUR" || title.includes("ecb") || title.includes("europe") || title.includes("gdp") || title.includes("pmi");
  }
  if (thread.key === "inflation_policy") {
    return currency === thread.currency || title.includes("inflation") || title.includes("central bank") || title.includes("boe");
  }
  if (thread.key === "market_mood") {
    return currency === "JPY" || currency === "CHF" || title.includes("risk") || title.includes("safe") || title.includes("central bank");
  }
  if (thread.key === "oil_demand") {
    return currency === "CAD" || title.includes("oil") || title.includes("canada");
  }
  if (thread.key === "global_demand") {
    return currency === "AUD" || currency === "NZD" || title.includes("china") || title.includes("commodity") || title.includes("global demand") || title.includes("trade");
  }
  return currency && currency === thread.currency;
}

function coherentThreadEvent(events, thread) {
  const matches = (events || []).filter((event) => eventMatchesThread(event, thread));
  return matches.find((event) => event.importance === "high") || matches[0] || null;
}

function macroShockLine(shock) {
  if (!shock) return null;
  const chain = (shock.transmission_chain || []).slice(0, 3).join(" → ");
  return chain || shock.explanation || shock.title;
}

function buildMacroTimeline(data) {
  const summaries = sortedSummaries(data.summaries || []);
  const lead = summaries[0] || {};
  const events = data.events || [];
  const thread = detectMacroThread(lead);
  const event = coherentThreadEvent(events, thread);
  const eventName = event ? shortEventTitle(event) : "";

  const threads = {
    us_policy: {
      changed: event ? `Recent US data kept policy expectations in focus.` : "Recent US data has kept policy expectations in focus.",
      now: lead.headline || "Rate expectations continue shaping USD.",
      next: event ? `Upcoming US data could shift policy expectations.` : "The next US data release could shift policy expectations.",
    },
    europe_growth: {
      changed: event ? `Recent European updates kept growth in focus.` : "Recent European data kept growth concerns in focus.",
      now: lead.headline || "Growth remains the euro's main pressure point.",
      next: event ? `Upcoming European data could change the growth picture.` : "The next European data update could change the growth picture.",
    },
    inflation_policy: {
      changed: event ? `Recent policy guidance kept inflation in focus.` : "Recent data kept inflation and policy in focus.",
      now: lead.headline || "Inflation is still shaping policy expectations.",
      next: event ? `${eventName} could refine policy expectations.` : "The next inflation or central bank update could refine expectations.",
    },
    market_mood: {
      changed: "Recent market moves kept defensive positioning in focus.",
      now: lead.headline || "Market mood is driving safer currencies.",
      next: event ? `${eventName} could shift market mood.` : "The next major macro update could shift market mood.",
    },
    oil_demand: {
      changed: event ? `Recent Canadian updates kept demand in focus.` : "Recent market moves kept oil and demand in focus.",
      now: lead.headline || "Oil and demand remain the main CAD drivers.",
      next: event ? `${eventName} could refine the CAD story.` : "Oil and US demand will remain the key things to watch.",
    },
    global_demand: {
      changed: "Recent data kept global demand in focus.",
      now: lead.headline || "Global demand remains the main driver.",
      next: event ? `${eventName} could refine the demand picture.` : "The next global demand update could change the picture.",
    },
    fallback: {
      changed: "Recent updates have not created one clear macro shift.",
      now: lead.headline || reframeNowTitle(data.market_story?.title || ""),
      next: event ? `${eventName} could add more clarity.` : "The next major release could add more clarity.",
    },
  };
  const story = threads[thread.key] || threads.fallback;

  return [
    {
      label: "Past",
      title: "What changed",
      body: story.changed,
    },
    {
      label: "Now",
      title: "What matters now",
      body: story.now,
    },
    {
      label: "Next",
      title: "What comes next",
      body: story.next,
    },
  ];
}

function countByLabel(summaries, label) {
  return summaries.filter((item) => item.label === label).length;
}

function confidenceScore(value) {
  if (value === "High") return 3;
  if (value === "Medium") return 2;
  return 1;
}

function labelScore(value) {
  if (value === "Supported") return 1;
  if (value === "Weak") return -1;
  return 0;
}

function summaryPriority(summary) {
  const direction = summary.label === "Neutral" ? 0 : 8;
  const eventBoost = summary.key_event ? 2 : 0;
  return direction + confidenceScore(summary.confidence) + eventBoost;
}

function pairPriority(item) {
  const contrast = Math.abs(labelScore(item.base_label) - labelScore(item.quote_label));
  const clearState = item.state === "Mixed macro picture" ? 0 : 4;
  const interactionType = item?.narrative?.interaction_type || item?.interaction_type || "";
  const relational = interactionType && interactionType !== "mixed_macro_forces" ? 7 : 0;
  const eventBoost = item?.has_key_event || item?.base_key_event || item?.quote_key_event ? 3 : 0;
  const focusBoost = item?.narrative_focus_match ? 2 : 0;
  return contrast * 10 + clearState + relational + eventBoost + focusBoost;
}

function sortedSummaries(summaries) {
  return [...summaries].sort((a, b) => summaryPriority(b) - summaryPriority(a));
}

function sortedPairs(pairs) {
  return [...(pairs || [])].sort((a, b) => pairPriority(b) - pairPriority(a));
}

function safePairText(item) {
  return [item?.pair, item?.base, item?.quote].filter(Boolean).join(" ").toLowerCase();
}

function summaryByCurrency(summaries) {
  return Object.fromEntries((summaries || []).map((summary) => [summary.currency, summary]));
}

function marketMood(summaries) {
  const byCurrency = summaryByCurrency(summaries);
  const labelFor = (currency) => byCurrency[currency]?.label || "Neutral";
  const defensiveScore =
    (labelFor("JPY") === "Supported" ? 2 : 0) +
    (labelFor("CHF") === "Supported" ? 2 : 0) +
    (labelFor("USD") === "Supported" ? 1 : 0) +
    (labelFor("AUD") === "Weak" ? 1 : 0) +
    (labelFor("NZD") === "Weak" ? 1 : 0);
  const appetiteScore =
    (labelFor("AUD") === "Supported" ? 2 : 0) +
    (labelFor("NZD") === "Supported" ? 2 : 0) +
    (labelFor("JPY") === "Weak" ? 1 : 0) +
    (labelFor("CHF") === "Weak" ? 1 : 0);

  if (defensiveScore >= 4 && defensiveScore > appetiteScore) {
    const currency = labelFor("JPY") === "Supported" ? "JPY" : labelFor("CHF") === "Supported" ? "CHF" : "USD";
    return {
      tone: "Defensive",
      body: "Investors are moving toward safer assets.",
      note: `${currency} is benefiting from defensive positioning.`,
    };
  }
  if (appetiteScore >= 3 && appetiteScore > defensiveScore) {
    const currency = labelFor("AUD") === "Supported" ? "AUD" : "NZD";
    return {
      tone: "Risk appetite improving",
      body: "Investors are more comfortable holding growth-sensitive currencies.",
      note: `${currency} is benefiting as market confidence improves.`,
    };
  }
  return {
    tone: "Balanced",
    body: "Investors are waiting for a clearer macro direction.",
    note: "No single market mood is dominating currencies right now.",
  };
}

function dominantRegionSignature(story, summaries) {
  const title = `${story?.title || ""} ${story?.body || ""}`.toUpperCase();
  const lead = sortedSummaries(summaries || [])[0]?.currency || "";
  const code = CURRENCY_ORDER.find((currency) => title.includes(currency)) || lead || "USD";

  if (code === "USD" || code === "CAD") {
    return {
      region: "North America",
      glow: "rgba(108, 171, 255, 0.24)",
      accent: "rgba(238, 244, 255, 0.18)",
      shapes: [
        "polygon(18% 20%, 68% 12%, 86% 35%, 72% 60%, 46% 54%, 26% 78%, 8% 54%)",
        "polygon(48% 58%, 76% 66%, 62% 92%, 38% 82%)",
      ],
    };
  }
  if (code === "EUR" || code === "GBP" || code === "CHF") {
    return {
      region: "Europe",
      glow: "rgba(206, 189, 255, 0.24)",
      accent: "rgba(255, 255, 255, 0.17)",
      shapes: [
        "polygon(38% 18%, 62% 20%, 72% 38%, 60% 58%, 36% 54%, 26% 36%)",
        "polygon(58% 54%, 76% 62%, 68% 78%, 48% 70%)",
      ],
    };
  }
  if (code === "JPY") {
    return {
      region: "East Asia",
      glow: "rgba(255, 181, 202, 0.22)",
      accent: "rgba(255, 238, 242, 0.18)",
      shapes: [
        "ellipse(28% 44% at 58% 34%)",
        "ellipse(18% 34% at 42% 66%)",
      ],
    };
  }
  if (code === "AUD" || code === "NZD") {
    return {
      region: "Asia-Pacific",
      glow: "rgba(112, 221, 211, 0.18)",
      accent: "rgba(224, 255, 249, 0.14)",
      shapes: [
        "polygon(36% 48%, 68% 42%, 82% 66%, 58% 82%, 30% 70%)",
        "ellipse(14% 26% at 78% 74%)",
      ],
    };
  }
  return {
    region: "Global",
    glow: "rgba(255, 255, 255, 0.16)",
    accent: "rgba(255, 255, 255, 0.12)",
    shapes: [
      "ellipse(42% 58% at 52% 48%)",
    ],
  };
}

function RegionSignature({ story, summaries }) {
  const signature = dominantRegionSignature(story, summaries);
  return (
    <div aria-hidden="true" className="reveal reveal-2" style={{
      position: "absolute",
      top: 38,
      right: 38,
      width: 164,
      height: 126,
      opacity: 0.72,
      pointerEvents: "none",
      mixBlendMode: "screen",
    }}>
      <div style={{
        position: "absolute",
        inset: "-18%",
        borderRadius: "50%",
        background: `radial-gradient(circle at 50% 45%, ${signature.glow}, transparent 58%)`,
        filter: "blur(8px)",
      }}></div>
      {signature.shapes.map((shape, index) => (
        <span key={index} style={{
          position: "absolute",
          inset: index === 0 ? "18px 16px 16px 14px" : "42px 18px 8px 52px",
          background: index === 0 ? signature.accent : "rgba(255,255,255,0.10)",
          clipPath: shape,
          filter: "blur(0.2px)",
          transform: index === 0 ? "rotate(-8deg)" : "rotate(10deg)",
        }}></span>
      ))}
      <span style={{
        position: "absolute",
        right: 8,
        top: 4,
        color: "rgba(255,255,255,0.30)",
        fontSize: 9,
        fontWeight: 900,
        letterSpacing: "0.16em",
        textTransform: "uppercase",
      }}>{signature.region}</span>
    </div>
  );
}

function pairIsMixed(item) {
  const interactionType = item?.narrative?.interaction_type || item?.interaction_type || "";
  const hasRelationalTheme = interactionType && interactionType !== "mixed_macro_forces";
  return (item.state === "Mixed macro picture" && !hasRelationalTheme) || pairPriority(item) < 6;
}

function pairMatchesFilter(item, filter) {
  if (filter === "clear") return !pairIsMixed(item);
  if (filter === "mixed") return pairIsMixed(item);
  return true;
}

function simplifyPairDriver(driver) {
  if (!driver) return "";
  const [code, text] = String(driver).split(":").map((part) => part.trim());
  if (!text) return cleanDisplaySentence(driver);

  const lower = text.toLowerCase();
  if (lower.includes("fed") || lower.includes("rate")) return `${code} supported by rates`;
  if (lower.includes("growth")) return `${code} pressured by weak growth`;
  if (lower.includes("inflation")) return `${code} shaped by inflation`;
  if (lower.includes("risk mood") || lower.includes("safety") || lower.includes("franc") || lower.includes("yen")) return `${code} driven by risk mood`;
  if (lower.includes("china") || lower.includes("commodity")) return `${code} driven by China and commodities`;
  if (lower.includes("oil")) return `${code} driven by oil and US demand`;
  if (lower.includes("global demand")) return `${code} driven by global demand`;
  return `${code} ${text.charAt(0).toLowerCase()}${text.slice(1)}`;
}

function pairNarrative(item) {
  return item?.narrative || {};
}

function pairReasonLines(item) {
  const narrative = pairNarrative(item);
  const relational = [
    narrative.interaction_reason,
    narrative.left_reason,
    narrative.right_reason,
  ].filter(Boolean).map(cleanDisplaySentence);
  if (relational.length) return relational;
  return (item.drivers || []).map(simplifyPairDriver).filter(Boolean);
}

function pairReasonBlocks(item) {
  const narrative = pairNarrative(item);
  const blocks = [];
  if (narrative.interaction_reason) {
    blocks.push({ label: "Relationship", body: cleanDisplaySentence(narrative.interaction_reason) });
  }
  if (narrative.left_reason) {
    blocks.push({ label: `${item.base} backdrop`, body: cleanDisplaySentence(narrative.left_reason) });
  }
  if (narrative.right_reason) {
    blocks.push({ label: `${item.quote} backdrop`, body: cleanDisplaySentence(narrative.right_reason) });
  }
  if (blocks.length) return blocks;
  return pairReasonLines(item).slice(0, 2).map((body, index) => ({
    label: index === 0 ? "Relationship" : "Context",
    body,
  }));
}

function pairDirection(item) {
  const baseScore = labelScore(item.base_label);
  const quoteScore = labelScore(item.quote_label);
  const baseWins = baseScore >= quoteScore;
  if (baseScore === quoteScore) {
    return {
      strong: item.base,
      weak: item.quote,
      strongLabel: item.base_label,
      weakLabel: item.quote_label,
      mixed: true,
    };
  }
  return {
    strong: baseWins ? item.base : item.quote,
    weak: baseWins ? item.quote : item.base,
    strongLabel: baseWins ? item.base_label : item.quote_label,
    weakLabel: baseWins ? item.quote_label : item.base_label,
    mixed: false,
  };
}

function pairSceneSentence(item) {
  const summary = pairNarrative(item).tension_summary || item.tension_summary;
  if (summary) return cleanDisplaySentence(summary);
  const direction = pairDirection(item);
  if (direction.mixed || pairIsMixed(item)) {
    return `${item.pair} does not have one clear macro backdrop right now.`;
  }
  return `${direction.strong} has the firmer macro backdrop than ${direction.weak}.`;
}

function pairContrastLine(item) {
  const summary = pairNarrative(item).tension_summary || item.tension_summary;
  if (summary) return cleanDisplaySentence(summary);
  const direction = pairDirection(item);
  if (direction.mixed || pairIsMixed(item)) return "No clean macro backdrop stands out right now";
  return `${direction.strong} has the firmer macro backdrop than ${direction.weak}`;
}

function pairInvalidation(item, summaries) {
  const narrativeChange = pairNarrative(item).what_changes_this || item.what_changes_this;
  if (narrativeChange) return cleanDisplaySentence(narrativeChange);
  const direction = pairDirection(item);
  const byCurrency = summaryByCurrency(summaries || []);
  const weakSummary = byCurrency[direction.weak];
  const strongSummary = byCurrency[direction.strong];
  if (direction.mixed || pairIsMixed(item)) {
    return "A clearer shift in one currency would make the pair easier to read.";
  }
  if (weakSummary?.invalidation) return weakSummary.invalidation;
  if (strongSummary?.invalidation) return strongSummary.invalidation;
  return `This could rebalance if ${direction.weak} gains a firmer macro backdrop or ${direction.strong} loses support.`;
}

function cleanDisplaySentence(value) {
  return String(value || "").replace(/\s+/g, " ").trim();
}

function formatImpact(value) {
  if (value === "high") return "High impact";
  if (value === "medium") return "Medium impact";
  if (value === "low") return "Low impact";
  return "";
}

function impactTone(value, t) {
  if (value === "high") {
    return {
      label: "High impact",
      message: "Market-moving event",
      bg: t.isDark ? "rgba(123,108,246,0.090)" : "rgba(123,108,246,0.16)",
      badgeBg: t.isDark ? "rgba(123,108,246,0.130)" : "rgba(123,108,246,0.22)",
      color: t.accent,
      border: t.isDark ? "rgba(123,108,246,0.260)" : "rgba(123,108,246,0.46)",
      shadow: t.isDark ? "0 14px 32px rgba(0,0,0,0.18)" : "0 16px 36px rgba(123,108,246,0.16)",
    };
  }
  if (value === "medium") {
    return {
      label: "Medium impact",
      message: "Can shift expectations",
      bg: t.accentDim,
      badgeBg: t.accentDim,
      color: t.accent,
      border: t.isDark ? "rgba(123,108,246,0.170)" : "rgba(123,108,246,0.28)",
      shadow: "none",
    };
  }
  if (value === "low") {
    return {
      label: "Low impact",
      message: "Limited impact expected",
      bg: t.inputBg,
      badgeBg: t.inputBg,
      color: t.muted,
      border: t.border,
      shadow: "none",
    };
  }
  return {
    label: "",
    message: "",
    bg: t.inputBg,
    badgeBg: t.inputBg,
    color: t.muted,
    border: t.border,
    shadow: "none",
  };
}

function parseUpcomingEvent(value) {
  const text = cleanDisplaySentence(value);
  const [main, rawImpact = ""] = text.split(" · ");
  const impactMatch = rawImpact.match(/^(High|Medium|Low) impact$/i);
  const impact = impactMatch ? impactMatch[1].toLowerCase() : "";
  const timingPatterns = [
    { regex: /\s(today)$/i, label: "Today" },
    { regex: /\s(tomorrow)$/i, label: "Tomorrow" },
    { regex: /\s(in \d+ days)$/i, label: null },
    { regex: /\s([A-Z][a-z]+ \d{1,2})$/, label: null },
  ];
  for (const item of timingPatterns) {
    const match = main.match(item.regex);
    if (match) {
      return {
        title: main.slice(0, match.index).trim(),
        timing: item.label || match[1].replace(/^in /i, "In "),
        impact,
      };
    }
  }
  return { title: main, timing: "", impact };
}

  const direction = pairDirection(item);
  const interactionType = item?.narrative?.interaction_type || item?.interaction_type || "";

  const baseWins = !direction.mixed && direction.strong === item.base;
  const quoteWins = !direction.mixed && direction.strong === item.quote;
  const baseStyle = labelStyle(item.base_label, t);
  const quoteStyle = labelStyle(item.quote_label, t);
  const baseSize = large ? (baseWins ? 78 : 44) : (baseWins ? 48 : 30);
  const quoteSize = large ? (quoteWins ? 78 : 44) : (quoteWins ? 48 : 30);
  const tensionLine = direction.mixed
    ? `linear-gradient(90deg, transparent, ${t.isDark ? "rgba(137,145,159,0.34)" : "rgba(140,144,154,0.42)"}, transparent)`
    : `linear-gradient(90deg, ${baseStyle.color}, rgba(140,144,154,0.28), ${quoteStyle.color})`;
  const relationalLine = t.isDark
    ? "linear-gradient(90deg, rgba(123,108,246,0.24), rgba(201,196,255,0.34), rgba(123,108,246,0.20))"
    : "linear-gradient(90deg, rgba(83,71,232,0.22), rgba(123,108,246,0.28), rgba(83,71,232,0.18))";
  const winningGlow = (style) => t.isDark
    ? `0 0 ${large ? 48 : 34}px ${style.bg}, 0 0 ${large ? 78 : 48}px rgba(123,108,246,0.08)`
    : `0 0 ${large ? 46 : 32}px ${style.bg}, 0 12px ${large ? 42 : 28}px rgba(10,15,35,0.06)`;
  return (
    <div className="pair-visual" style={{ display: "grid", gridTemplateColumns: "1fr minmax(54px, 0.55fr) 1fr", alignItems: "center", gap: large ? 18 : 10, margin: large ? "26px 0 24px" : "18px 0 16px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ width: baseSize, height: baseSize, borderRadius: 999, background: baseStyle.bg, border: `1px solid ${baseStyle.color}`, boxShadow: baseWins ? winningGlow(baseStyle) : "none", opacity: baseWins ? 1 : 0.70, flexShrink: 0 }}></span>
        <span style={{ color: baseStyle.color, fontSize: large ? 18 : 13, fontWeight: 900 }}>{item.base}</span>
      </div>
      <div style={{ height: large ? 10 : 6, borderRadius: 999, background: direction.mixed && relational ? relationalLine : tensionLine, opacity: direction.mixed ? (relational ? 0.70 : 0.42) : 0.74, filter: large ? "blur(0.2px)" : "blur(0.1px)", boxShadow: relational ? `0 0 ${large ? 28 : 18}px rgba(83,71,232,0.08)` : direction.mixed ? "none" : `0 0 ${large ? 30 : 20}px rgba(83,71,232,0.10)` }}></div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 10 }}>
        <span style={{ color: quoteStyle.color, fontSize: large ? 18 : 13, fontWeight: 900 }}>{item.quote}</span>
        <span style={{ width: quoteSize, height: quoteSize, borderRadius: 999, background: quoteStyle.bg, border: `1px solid ${quoteStyle.color}`, boxShadow: quoteWins ? winningGlow(quoteStyle) : "none", opacity: quoteWins ? 1 : 0.70, flexShrink: 0 }}></span>
      </div>
    </div>
  );
}

    .filter((item) => !query || safePairText(item).includes(query));

                  <PairCard key={item.pair} item={item} t={t} variant="compact" onOpen={onOpenPair}/>

function PairTensionScene({ pair, data, onBack, t }) {
  const direction = pairDirection(pair);
  const reasonBlocks = pairReasonBlocks(pair).slice(0, 3);
  const sentence = pairSceneSentence(pair);
  const invalidation = pairInvalidation(pair, data.summaries);
  const priceAlignment = data.price_alignment?.[pair.pair] || null;
  const baseWins = !direction.mixed && direction.strong === pair.base;
  const quoteWins = !direction.mixed && direction.strong === pair.quote;
  const baseScale = direction.mixed ? 0.94 : baseWins ? 1.16 : 0.76;
  const quoteScale = direction.mixed ? 0.94 : quoteWins ? 1.16 : 0.76;
  const baseIsWeak = !direction.mixed && direction.weak === pair.base;
  const quoteIsWeak = !direction.mixed && direction.weak === pair.quote;
  const massStyle = (strong, weak, scale) => ({
    width: 148,
    height: 148,
    borderRadius: "50%",
    transform: `scale(${scale})`,
    background: strong
      ? "radial-gradient(circle at 38% 28%, rgba(255,255,255,0.42), rgba(123,108,246,0.40) 24%, rgba(83,71,232,0.72) 58%, rgba(44,30,132,0.80) 100%)"
      : weak
        ? "radial-gradient(circle at 38% 28%, rgba(255,255,255,0.38), rgba(192,90,66,0.30) 26%, rgba(192,90,66,0.58) 60%, rgba(113,43,54,0.60) 100%)"
        : `radial-gradient(circle at 38% 28%, rgba(255,255,255,0.34), ${t.accentDim} 30%, rgba(140,144,154,0.22) 68%, rgba(140,144,154,0.16) 100%)`,
    boxShadow: strong
      ? "0 30px 76px rgba(83,71,232,0.22), 0 0 80px rgba(123,108,246,0.14)"
      : weak
        ? "0 24px 58px rgba(192,90,66,0.12), 0 0 58px rgba(192,90,66,0.08)"
        : "0 22px 54px rgba(10,15,35,0.08)",
    filter: strong ? "saturate(0.88) blur(0.1px)" : weak ? "saturate(0.68) blur(0.4px)" : "saturate(0.62) blur(0.25px)",
    opacity: strong ? 0.92 : weak ? 0.68 : 0.70,
  });
  const sideCaption = (code) => {
    if (direction.mixed) return "Balanced";
    return code === direction.strong ? "Firmer backdrop" : "Softer backdrop";
  };
  const sideColor = (code) => {
    if (direction.mixed) return t.muted;
    return code === direction.strong ? t.accent : "#C05A42";
  };

  return (
    <div className="content-area page-enter" style={{ padding: "38px 40px 72px", width: "100%", maxWidth: 1040 }}>
      <button onClick={onBack} style={{ background: "transparent", border: "none", color: t.accent, fontWeight: 800, marginBottom: 18 }}>Back</button>
      <section className="detail-hero hero-enter" style={{
        background: `linear-gradient(135deg, ${t.card} 0%, ${t.inputBg} 68%, ${t.card} 100%)`,
        border: `1px solid ${t.border}`,
        borderRadius: 28,
        padding: "48px 50px",
        boxShadow: "0 30px 86px rgba(10, 15, 35, 0.14)",
        overflow: "hidden",
        position: "relative",
      }}>
        <p className="reveal reveal-1" style={{ fontSize: 11, letterSpacing: "0.17em", textTransform: "uppercase", color: t.muted, fontWeight: 900, marginBottom: 12 }}>Macro tension scene</p>
        <h1 className="page-title reveal reveal-2" style={{ fontFamily: "'Instrument Serif',serif", color: t.ink, fontSize: 74, lineHeight: 0.95, fontWeight: 400, marginBottom: 36 }}>{pair.pair}</h1>

        <div className="hero-grid reveal reveal-3" style={{
          position: "relative",
          minHeight: 340,
          display: "grid",
          gridTemplateColumns: "1fr minmax(170px, 0.72fr) 1fr",
          alignItems: "center",
          gap: 18,
          marginBottom: 34,
        }}>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 14 }}>
            <div style={massStyle(baseWins, baseIsWeak, baseScale)}></div>
            <div style={{ textAlign: "center" }}>
              <p style={{ color: sideColor(pair.base), fontSize: 27, fontWeight: 900, lineHeight: 1 }}>{pair.base}</p>
              <p style={{ color: t.muted, fontSize: 12, fontWeight: 800, marginTop: 6 }}>{sideCaption(pair.base)}</p>
            </div>
          </div>

          <div style={{
            height: 5,
            borderRadius: 999,
            background: direction.mixed
              ? `linear-gradient(90deg, transparent, ${t.border}, transparent)`
              : baseWins
                ? "linear-gradient(90deg, rgba(83,71,232,0) 0%, rgba(83,71,232,0.42) 22%, rgba(142,104,238,0.22) 52%, rgba(192,90,66,0.22) 80%, rgba(192,90,66,0) 100%)"
                : "linear-gradient(90deg, rgba(192,90,66,0) 0%, rgba(192,90,66,0.22) 22%, rgba(142,104,238,0.22) 52%, rgba(83,71,232,0.42) 80%, rgba(83,71,232,0) 100%)",
            filter: "blur(0.2px)",
            boxShadow: "0 0 28px rgba(83,71,232,0.10)",
          }}></div>

          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 14 }}>
            <div style={massStyle(quoteWins, quoteIsWeak, quoteScale)}></div>
            <div style={{ textAlign: "center" }}>
              <p style={{ color: sideColor(pair.quote), fontSize: 27, fontWeight: 900, lineHeight: 1 }}>{pair.quote}</p>
              <p style={{ color: t.muted, fontSize: 12, fontWeight: 800, marginTop: 6 }}>{sideCaption(pair.quote)}</p>
            </div>
          </div>
        </div>

        <div className="reveal reveal-4" style={{ borderTop: `1px solid ${t.border}`, paddingTop: 24 }}>
          <p style={{ color: t.ink, fontFamily: "'Instrument Serif',serif", fontSize: 34, lineHeight: 1.15, fontWeight: 400, maxWidth: 720, marginBottom: 18 }}>{sentence}</p>
          {!!reasonBlocks.length && (

  );
}

        <div className="hero-grid reveal reveal-5" style={{ display: "grid", gridTemplateColumns: "minmax(0, 1.35fr) minmax(240px, 0.65fr)", gap: 18 }}>

            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {support.slice(0, 2).map((reason, index) => (
                <div key={index} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                  <span style={{ width: 6, height: 6, borderRadius: 999, background: t.accent, marginTop: 8, flexShrink: 0 }}></span>
                  <p style={{ color: t.ink, fontSize: 15, lineHeight: 1.55 }}>{reason}</p>
                </div>
              ))}
              {!support.length && <p style={{ color: t.ink, fontSize: 15, lineHeight: 1.55 }}>{summary.insight}</p>}
            </div>
          </div>
          {(summary.invalidation || summary.key_event) && (
            <div style={{ borderTop: `1px solid ${t.border}`, paddingTop: 18 }}>
              {summary.invalidation && (
                <>
              <p style={{ fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: t.muted, fontWeight: 800, marginBottom: 10 }}>What would change this</p>
              <div style={{ borderRadius: 14, background: t.inputBg, border: `1px solid ${t.border}`, padding: "13px 14px" }}>
                <p style={{ color: t.ink, fontSize: 14, lineHeight: 1.6 }}>{summary.invalidation}</p>
              </div>
                </>
              )}
              {upcoming && (
                <div style={{
                  marginTop: 18,
                  borderRadius: 16,
                  background: upcomingTone.bg,
                  border: `1px solid ${upcomingTone.border}`,
                  padding: "14px 15px",
                  boxShadow: upcomingTone.shadow,
                }}>
                  <p style={{ fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: t.muted, fontWeight: 800, marginBottom: 6 }}>Upcoming event</p>
                  <p style={{ color: t.ink, fontSize: 15, fontWeight: 900, lineHeight: 1.35, marginBottom: 10 }}>{upcoming.title}</p>
                  <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginBottom: upcomingTone.message ? 10 : 0 }}>

                    {upcomingTone.label && <span style={{ borderRadius: 999, background: upcomingTone.badgeBg, border: `1px solid ${upcomingTone.border}`, color: upcomingTone.color, padding: "5px 8px", fontSize: 11, fontWeight: 900 }}>{upcomingTone.label}</span>}
                  </div>
                  {upcomingTone.message && <p style={{ color: upcomingTone.color, fontSize: 12, fontWeight: 900 }}>{upcomingTone.message}</p>}
                </div>

          )}
        </div>
      </section>
    </div>
  );
}

function BottomNav({ tab, setTab, t }) {
  const items = [
    { id: "overview", label: "Today" },
    { id: "movements", label: "Pairs" },
    { id: "learn", label: "Learn" },
  ];
  return (
    <div className="show-mobile" style={{
      position: "fixed",
      bottom: 0,
      left: 0,
      right: 0,
      zIndex: 100,
      background: `${t.card}EE`,
      backdropFilter: "blur(12px)",
      borderTop: `1px solid ${t.border}`,
      padding: "10px 8px 18px",
      justifyContent: "space-around",
    }}>
      {items.map((item) => {
        const active = tab === item.id;
        return (
          <button key={item.id} className="nav-button" onClick={() => setTab(item.id)} style={{
            border: "none",
            background: active ? t.accentDim : "transparent",
            color: active ? t.accent : t.muted,
            borderRadius: 12,
            padding: "10px 16px",
            fontSize: 12,
            fontWeight: 800,

      })}

  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }

  static getDerivedStateFromError() {
    return { hasError: true };
  }

  componentDidCatch(error) {
    console.error("Lucid view error", error);
  }

  render() {
    if (!this.state.hasError) return this.props.children;
    return (
      <div className="content-area page-enter" style={{ padding: "38px 40px 72px", width: "100%", maxWidth: 760 }}>
        <EmptyState
          t={this.props.t}
          title="This view could not load"
          body="Lucid kept the app open. Go back to Today or refresh the page."
        />
      </div>
    );
  }
}

function App() {
  const { data, loading, error } = useLucidData();
  const [tab, setTab] = React.useState("overview");
  const [dark, setDark] = React.useState(false);
  const [detail, setDetail] = React.useState(null);
  const [pairDetail, setPairDetail] = React.useState(null);
  const [searchQuery, setSearchQuery] = React.useState("");
  const mainRef = React.useRef(null);
  const t = dark ? darkTheme : lightTheme;
  const auth = useLucidAuth();
  const meta = loading ? "Loading live data" : error ? "Fallback data" : `${data.summary_mode} · ${formatGeneratedAt(data.generated_at)}`;

  const logout = async () => {
    await window.LucidSupabase?.signOut();
    window.location.href = "auth.html?mode=login";
  };

  React.useEffect(() => {
    mainRef.current?.scrollTo({ top: 0, behavior: "auto" });
  }, [tab, detail?.currency, pairDetail?.pair]);

  const changeTab = (next) => {
    setTab(next);
    setDetail(null);
    setPairDetail(null);
    setSearchQuery("");
  };

  if (!auth.configured) {
    return <AuthSetupScreen t={t}/>;
  }

  if (auth.loading) {
    return <AuthLoadingScreen t={t}/>;
  }

  if (auth.error) {
    return (
      <AuthShell t={t} title="Access could not be verified." body={auth.error}>
        <button onClick={logout} style={{ border: `1px solid ${t.border}`, background: t.inputBg, color: t.ink, borderRadius: 999, padding: "11px 15px", fontWeight: 850 }}>Return to sign in</button>
      </AuthShell>
    );
  }

  if (!window.LucidSupabase?.hasAccess(auth.profile)) {
    return <TrialEndedScreen t={t} onLogout={logout}/>;
  }

  return (
    <div data-dark={dark} style={{ background: t.bg, minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div className="app-layout" style={{ display: "grid", gridTemplateColumns: "220px 1fr", minHeight: "100vh" }}>
        <Sidebar
          tab={tab}
          setTab={changeTab}
          dark={dark}
          toggleDark={() => setDark((value) => !value)}
          t={t}
          userEmail={auth.session?.user?.email}
          profile={auth.profile}
          onLogout={logout}
        />
        <div style={{ display: "flex", flexDirection: "column", minHeight: "100vh", overflow: "hidden" }}>
          <Header t={t} dark={dark} toggleDark={() => setDark((value) => !value)} dataMeta={meta} searchQuery={searchQuery} setSearchQuery={setSearchQuery}/>
          <main ref={mainRef} style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", alignItems: "center" }}>
            <ErrorBoundary key={`${tab}-${dark ? "dark" : "light"}-${pairDetail?.pair || detail?.currency || "list"}`} t={t}>
              {pairDetail ? (
                <PairTensionScene pair={pairDetail} data={data} onBack={() => setPairDetail(null)} t={t}/>
              ) : detail ? (
                <DetailScreen summary={detail} summaryMode={data.summary_mode} onBack={() => setDetail(null)} t={t}/>
              ) : tab === "overview" ? (
                <OverviewScreen data={data} t={t} onOpenCurrency={setDetail} onOpenPair={setPairDetail} searchQuery={searchQuery}/>
              ) : tab === "movements" ? (
                <MovementsScreen data={data} t={t} onOpenPair={setPairDetail} searchQuery={searchQuery}/>
              ) : (
                <LearnScreen t={t}/>
              )}
            </ErrorBoundary>
          </main>
          <p style={{ padding: "0 28px 18px", color: t.muted, fontSize: 11, textAlign: "center" }}>{data.disclaimer}</p>
        </div>
      </div>
      <BottomNav tab={tab} setTab={changeTab} t={t}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
